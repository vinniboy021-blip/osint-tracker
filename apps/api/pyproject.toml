[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-tracker-api"
version = "0.1.0"
description = "Plataforma OSINT com escopo autorizado e proveniência auditável"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116", "starlette>=0.41,<0.42", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.6,<3",
  "argon2-cffi>=23.1", "python-multipart>=0.0.20", "redis>=5,<7", "celery>=5.4,<6",
  "croniter>=6,<7", "httpx>=0.27,<0.28", "dnspython>=2.7,<3", "feedparser>=6,<7",
  "httpcore>=1,<2", "defusedxml>=0.7,<1", "tenacity>=9,<10", "prometheus-client>=0.21,<1", "cryptography>=44", "email-validator>=2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-redis", "types-croniter"]

[project.scripts]
osint-tracker = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
