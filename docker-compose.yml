name: osint-tracker
x-api-environment: &api-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-osint}:${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD em .env}@postgres:5432/${POSTGRES_DB:-osint}
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: ${ENVIRONMENT:-development}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,api,web,testserver}
  CONNECTOR_SECRET_KEY: ${CONNECTOR_SECRET_KEY:-}
  EVIDENCE_PATH: /data/evidence
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
  LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  EVIDENCE_MAX_BYTES: ${EVIDENCE_MAX_BYTES:-20971520}
  COLLECTION_MAX_RECORDS: ${COLLECTION_MAX_RECORDS:-100}
  COLLECTION_MAX_ATTEMPTS: ${COLLECTION_MAX_ATTEMPTS:-3}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-15}
  AI_ENABLED: ${AI_ENABLED:-false}
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-osint-tracker@localhost}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: osint-tracker-api:local
  environment: *api-environment
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes:
    - evidence_data:/data/evidence
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osint}
      POSTGRES_USER: ${POSTGRES_USER:-osint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD em .env}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory, 256mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *api
    command: [alembic, upgrade, head]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  api:
    <<: *api
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
  worker:
    <<: *api
    command: [celery, -A, 'app.celery_app:celery_app', worker, --loglevel=INFO, '--concurrency=${WORKER_CONCURRENCY:-4}']
    depends_on:
      migrate:
        condition: service_completed_successfully
  beat:
    <<: *api
    command: [celery, -A, 'app.celery_app:celery_app', beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    image: osint-tracker-web:local
    environment:
      API_INTERNAL_URL: http://api:8000
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    restart: unless-stopped
    ports:
      - 127.0.0.1:${WEB_PORT:-3000}:3000
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1001,gid=1001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  evidence_data:
  prometheus_data:
